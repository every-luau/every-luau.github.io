name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Publishing to a registry does not push anything, so check for new releases regularly.
  schedule:
    - cron: "0 */6 * * *"
  # Sent by the monorepo's CI when its main branch changes.
  repository_dispatch:
    types: [library-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Without blobs until they are needed, but with the whole history for when files last changed.
      - name: Clone the libraries monorepo
        run: git clone --quiet --filter=blob:none "https://github.com/${{ github.repository_owner }}/every.git" every

      - run: npm ci
      - run: npm run generate -- every/libraries
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
